name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Configure npm auth for @lowtyde packages
        env:
          LOWTYDE_NPM_TOKEN: ${{ secrets.LOWTYDE_NPM_TOKEN }}
        run: |
          cat > ~/.npmrc << EOF
          @lowtyde:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${LOWTYDE_NPM_TOKEN}
          EOF

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm --filter @wordle-clash/web build
